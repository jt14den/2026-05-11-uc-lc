<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <style>
    :root {
      --uc-blue:       #1a3a6e;
      --uc-gold:       #FDB515;
      --uc-mid-blue:   #1a5592;
    }
    .reveal {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 36px;
      color: #222;
    }
    .reveal h1, .reveal h2 {
      color: var(--uc-blue);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      border-left: 8px solid var(--uc-gold);
      padding-left: 0.35em;
      margin-bottom: 0.6em;
      text-align: left;
    }
    .reveal h3 {
      color: var(--uc-mid-blue);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.6em;
      letter-spacing: 0.06em;
      margin-top: 0.8em;
      margin-bottom: 0.4em;
      text-align: left;
    }
    .reveal ul {
      list-style: none;
      margin-left: 0;
      text-align: left;
    }
    .reveal ul li {
      position: relative;
      padding-left: 1.2em;
      margin-bottom: 0.4em;
    }
    .reveal ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.45em;
      width: 10px;
      height: 10px;
      background: var(--uc-gold);
    }
    .reveal p {
      text-align: left;
    }
    .reveal blockquote {
      background: var(--uc-gold);
      border: none;
      border-radius: 4px;
      padding: 0.5em 1em;
      font-style: normal;
      font-weight: 700;
      color: #1a1a1a;
      width: 90%;
      box-shadow: none;
    }
    .reveal section {
      text-align: left;
    }
    .reveal .progress {
      color: var(--uc-gold);
    }
    .reveal .controls {
      color: var(--uc-blue);
    }
    /* Icon-led lists — suppresses gold square so the emoji/char acts as the bullet */
    .icon-list li::before {
      display: none;
    }
    .icon-list li {
      padding-left: 0;
    }
    /* Two-column helper — wrap content in a div.two-col in markdown using HTML */
    .two-col {
      display: flex;
      gap: 2rem;
      width: 100%;
    }
    .two-col > * { flex: 1; }
    .uc-logo {
      position: fixed;
      top: 1rem;
      left: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
      pointer-events: none;
    }
    .uc-logo-badge {
      background: #FDB515;
      color: #111;
      font-weight: 900;
      font-size: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0.25rem 0.45rem;
      border-radius: 5px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .uc-logo-name {
      color: #3B72AE;
      font-weight: 700;
      font-size: 1.1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.01em;
    }
    /* Badge utility — use <span class="slide-badge"> in slide markdown */
    .reveal .slide-badge {
      display: inline-block;
      background: var(--uc-gold);
      color: #111;
      font-weight: 900;
      padding: 0.15em 0.45em;
      border-radius: 6px;
      font-size: 1.15em;
      letter-spacing: 0.01em;
    }
    /* === Title slide === */
    .reveal section.title-slide {
      overflow: hidden;
      padding: 0 3rem 2rem;
    }
    /* Gold accent bar at top */
    .reveal section.title-slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 7px;
      background: var(--uc-gold);
      z-index: 2;
    }
    /* Decorative blue circle top-right */
    .reveal section.title-slide::after {
      content: '';
      position: absolute;
      top: -140px; right: -140px;
      width: 560px; height: 560px;
      background: var(--uc-mid-blue);
      border-radius: 50%;
      z-index: 0;
    }
    .reveal section.title-slide h2 {
      border-left: none;
      padding-left: 0;
      font-size: 2.8em;
      text-transform: none;
      color: var(--uc-blue);
      line-height: 1.0;
      letter-spacing: -0.02em;
      margin-bottom: 0.15em;
      position: relative;
      z-index: 1;
    }
    .title-eyebrow {
      font-size: 0.42em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--uc-mid-blue);
      letter-spacing: 0.1em;
      margin-top: 2.8rem;
      margin-bottom: 0.6em;
      position: relative;
      z-index: 1;
    }
    .title-date {
      font-size: 0.55em;
      font-weight: 400;
      color: #333;
      margin-bottom: 0.8em;
      position: relative;
      z-index: 1;
    }
    .title-url {
      display: inline-block;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.45em;
      color: var(--uc-mid-blue);
      font-weight: 600;
      border-bottom: 3px solid var(--uc-gold);
      padding-bottom: 0.25em;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="slide-source" style="display:none">{{ content }}</div>

  <div class="reveal">
    <div class="slides"></div>
  </div>

  <div class="uc-logo">
    <span class="uc-logo-badge">UC</span>
    <span class="uc-logo-name">Carpentries</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script>
    // Jekyll renders --- as <hr>; split on that to create slides
    const raw = document.getElementById('slide-source').innerHTML;
    const chunks = raw.split(/<hr\s*\/?>/i).filter(s => s.trim());
    const slidesEl = document.querySelector('.slides');

    chunks.forEach(html => {
      const section = document.createElement('section');
      // <!-- class: foo bar --> at the start of a slide adds classes to the <section>
      const classMatch = html.match(/<!--\s*class:\s*([^-]+?)\s*-->/);
      if (classMatch) {
        classMatch[1].trim().split(/\s+/).forEach(c => section.classList.add(c));
        html = html.replace(classMatch[0], '');
      }
      section.innerHTML = html;
      slidesEl.appendChild(section);
    });

    Reveal.initialize({
      hash: true,
      controls: true,
      progress: true,
      slideNumber: 'c/t',
      transition: 'fade',
      width: 1200,
      height: 700,
      margin: 0.08,
    });
  </script>
</body>
</html>
